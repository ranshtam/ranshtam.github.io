<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ranshtam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
      color: #f0f6fc;
    }

    .tagline {
      color: #8b949e;
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .project-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      text-align: left;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .project-card:hover {
      border-color: #58a6ff;
      background: #1c2128;
    }

    .project-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .project-info h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 0.2rem;
    }

    .project-info p {
      font-size: 0.875rem;
      color: #8b949e;
    }

    .links {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }

    .links a {
      color: #8b949e;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .links a:hover {
      color: #58a6ff;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>ranshtam</h1>
    <p class="tagline">projects &amp; experiments</p>

    <div class="projects">
      <a href="/mine-sweeper/" class="project-card">
        <span class="project-icon">💣</span>
        <div class="project-info">
          <h2>Mine Sweeper</h2>
          <p>Classic minesweeper game built with vanilla JS</p>
        </div>
      </a>
    </div>

    <div class="links">
      <a href="https://github.com/ranshtam" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>

</html>
