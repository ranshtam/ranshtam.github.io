<section class="rs-leak" dir="rtl" aria-label="איפה החנות מפסידה מכירות">
  <style>
    .rs-leak{--nos:"Nostela FS",Talent,Arial,sans-serif;--tal:Talent,"Segoe UI",Arial,sans-serif;--lime:#CAFC01;--dark:#101400;position:relative;height:230vh;background:#101400;color:#fff;font-family:var(--tal)}

    .rs-leak h2.rs-leak__h em{font-style:normal;color:#CAFC01}

    .rs-leak__steps li.is-act{opacity:1;transform:none;background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border-color:rgba(202,252,1,.45);box-shadow:0 22px 50px rgba(0,0,0,.4),0 0 0 4px rgba(202,252,1,.06),inset 0 1px 0 rgba(255,255,255,.12)}

    .rs-leak__n{position:relative;flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:#101400;font-family:var(--nos);font-weight:500;font-size:14px;color:#fff;transition:background .4s,border-color .4s,color .4s,transform .5s cubic-bezier(.2,.9,.3,1.7),box-shadow .4s}
    .rs-leak__steps li.is-act .rs-leak__n{border-color:#CAFC01;box-shadow:0 0 0 5px rgba(202,252,1,.14)}
    .rs-leak__n svg{display:none;width:17px;height:17px}
    .rs-leak__steps li.is-done .rs-leak__n{background:#CAFC01;border-color:#CAFC01;color:#101400;transform:scale(1.08)}
    .rs-leak__steps li.is-done .rs-leak__n b{display:none}
    .rs-leak__steps li.is-done .rs-leak__n svg{display:block;animation:rs-leak-pop .5s cubic-bezier(.2,.9,.3,1.7)}
    @keyframes rs-leak-pop{from{transform:scale(0) rotate(-30deg)}}
    .rs-leak__steps li>div{flex:1;min-width:0}
    .rs-leak .rs-leak__t{font-size:18px;font-weight:600;color:#fff;line-height:1.3}
    .rs-leak .rs-leak__d{font-size:15px;line-height:1.55;color:#c9cdbb;margin-top:2px;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .4s,margin-top .4s}

      .rs-leak__in{height:100%;padding:18px 16px 16px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
      .rs-leak .rs-leak__kicker{font-size:12.5px;margin-bottom:6px}
      .rs-leak h2.rs-leak__h{font-size:clamp(21px,6.2vw,28px)}
      .rs-leak__viz{flex:0 1 auto;min-height:0;max-width:none;display:flex;justify-content:center}
      .rs-leak__viz{width:100%}
      .rs-leak__viz canvas{width:100%;max-width:none;aspect-ratio:auto;height:50vh;height:50svh;max-height:none;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 10%,#000 90%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);mask-composite:intersect}
      .rs-leak__steps-wrap{min-height:96px;display:flex;flex-direction:column;justify-content:center}
      .rs-leak__steps{max-width:none;gap:0;text-align:start;align-self:stretch;width:100%}
      .rs-leak__steps li{display:none;opacity:1;padding:12px 14px;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
      .rs-leak__steps li,.rs-leak__steps li.is-act,.rs-leak__steps li.is-done{transform:none}
      .rs-leak .rs-leak__steps li .rs-leak__d{max-height:60px;opacity:1}
      .rs-leak .rs-leak__steps li .rs-leak__bar{max-height:3px;opacity:1;margin-top:10px}
      .rs-leak__steps li.is-cur{display:flex;animation:rs-leak-in .4s cubic-bezier(.2,.8,.2,1)}
      .rs-leak .rs-leak__t{font-size:17px}
      .rs-leak .rs-leak__d{font-size:14.5px}
      .rs-leak__end{display:none;flex-direction:column;gap:12px;margin:0;padding:0;justify-content:center;text-align:center}
      .rs-leak__end.is-on{display:flex;animation:rs-leak-in .4s cubic-bezier(.2,.8,.2,1)}
      .rs-leak .rs-leak__sum{font-size:16px}
    }
    @keyframes rs-leak-in{from{opacity:0;transform:translateY(10px)}}
  </style>

    function fxdraw(){
